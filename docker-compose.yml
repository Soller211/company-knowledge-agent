x-app: &app
  build: .
  image: company-knowledge-agent:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql://cka:${POSTGRES_PASSWORD:-cka}@db:5432/cka
    DOCS_DIR: /data/docs
  volumes:
    # A missing DOCS_HOST_DIR is mounted as an empty folder; `cka ingest` refuses to treat
    # an empty folder as "every document was deleted".
    - ${DOCS_HOST_DIR:-./examples/docs}:/data/docs:ro
    - models:/models
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: cka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cka}
      POSTGRES_DB: cka
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cka -d cka"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    ports:
      # Localhost only by default. Set API_BIND=0.0.0.0 only behind an HTTPS reverse proxy.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped

  # One-off: docker compose run --rm ingest
  ingest:
    <<: *app
    command: ["cka", "ingest"]
    profiles: ["tools"]

volumes:
  pgdata:
  models:
