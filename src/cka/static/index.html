<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Knowledge Agent</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="no-session">
<button id="menu-toggle" class="menu-toggle" type="button" aria-label="Abrir menú"></button>
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <section id="login-view" class="login" hidden>
      <h1>Company Knowledge Agent</h1>
      <p class="muted">Inicia sesión para preguntar sobre los documentos de la empresa.</p>
      <form id="login-form" class="login">
        <label class="field">Usuario <input name="username" autocomplete="username" required></label>
        <label class="field">Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
        <button>Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="chat-view" hidden>
      <div id="log" class="chat-log" aria-live="polite"></div>
      <form id="ask-form" class="ask-form">
        <label class="sr-only" for="question">Pregunta</label>
        <textarea id="question" name="question" placeholder="Pregunta sobre la empresa…" maxlength="2000" required></textarea>
        <button id="ask-button" aria-label="Preguntar"></button>
      </form>
    </section>
  </main>
</div>
<script src="/static/app.js"></script>
<script>
function show(me) {
  document.getElementById("login-view").hidden = Boolean(me);
  document.getElementById("chat-view").hidden = !me;
}

function addMessage(text, kind) {
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  div.textContent = text;
  document.getElementById("log").append(div);
  div.scrollIntoView({behavior: "smooth", block: "end"});
  return div;
}

function addSources(div, data) {
  if (!data.verified) {
    const warning = document.createElement("div");
    warning.className = "warn";
    warning.textContent = "Respuesta sin citas verificadas: compruébala en los documentos.";
    div.append(warning);
  }
  if (!data.citations.length) return;
  const list = document.createElement("ul");
  list.className = "sources";
  for (const c of data.citations) {
    const item = document.createElement("li");
    item.textContent = `[${c.n}] ${c.file}${c.page ? `, p. ${c.page}` : ""} — ${c.snippet}`;
    list.append(item);
  }
  div.append(list);
}

document.getElementById("ask-button").append(icon("send"));

document.getElementById("login-form").onsubmit = async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  const {status, data} = await api("/login", {
    method: "POST",
    json: {username: form.get("username"), password: form.get("password")},
  });
  if (status !== 200) {
    document.getElementById("login-error").textContent = errorText(data, "No se pudo iniciar sesión");
    return;
  }
  event.target.reset();
  document.getElementById("login-error").textContent = "";
  show(await startPage());
};

document.getElementById("ask-form").onsubmit = async (event) => {
  event.preventDefault();
  const textarea = document.getElementById("question");
  const question = textarea.value.trim();
  if (!question) return;
  textarea.value = "";
  addMessage(question, "user");
  const pending = addMessage("Buscando…", "bot");
  const button = document.getElementById("ask-button");
  button.disabled = true;
  try {
    const {status, data} = await api("/ask", {method: "POST", json: {question}});
    if (status === 401) {
      pending.remove();
      renderSidebar(null);
      show(null);
      return;
    }
    if (status !== 200) {
      pending.textContent = errorText(data, "Error inesperado");
      pending.classList.add("error");
      return;
    }
    pending.textContent = data.answer;
    addSources(pending, data);
  } catch {
    pending.textContent = "No se pudo conectar con el servidor";
    pending.classList.add("error");
  } finally {
    button.disabled = false;
  }
};

document.getElementById("question").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    document.getElementById("ask-form").requestSubmit();
  }
});

startPage().then(show);
</script>
</body>
</html>
